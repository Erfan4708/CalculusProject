{% extends 'base.html' %}
{% block title %}Curves{% endblock title %}
{% block content %}
    <div class="barber_section layout_padding">
        <div class="container">
            {% for post in posts %}
                <div class="braber_taital_main">
                    <div class="row">

                        <div>
                            <div class="barber_bg_main">
                                <div class="text-center">
                                    <div class="fashion_img">
                                        <img src="{{ post.image.url }}" alt="{{ post.title }}">
                                    </div>
                                </div>
                                <h1 class="barber_taital">{{ post.title|capfirst }}</h1>
                                <p class="barber_text">{{ post.information_text|truncatewords:90 }}</p>
                                <div class="blogr_right">
                                    <a href="{% url 'blog:post_detail' post.id %}" class="btn btn-custom font-weight-bold text-center ">Read
                                        More!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
            {% include 'pagination.html' %}
        </div>
    </div>
{% endblock content %}
